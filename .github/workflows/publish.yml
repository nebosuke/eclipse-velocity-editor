name: Publish Update Site

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-update-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(python3 scripts/bump_version.py)
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add -A
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin main

      - name: Build update site
        run: mvn -DskipTests -B clean verify

      - name: Publish to gh-pages
        run: |
          SITE_DIR=$(mktemp -d)
          cp -R io.github.nebosuke.velocityeditor.updatesite/target/repository/. "$SITE_DIR"/

          git fetch origin gh-pages
          git checkout gh-pages

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -R "$SITE_DIR"/. .
          touch .nojekyll

          git add -A
          git commit -m "Publish update site v${{ steps.bump.outputs.new_version }}"
          git push origin gh-pages
